<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>図書室 蔵書検索</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="theme-color" content="#1F2937" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <div class="hero">
    <div class="hero-text">
      <div class="eyebrow">SCHOOL LIBRARY</div>
      <div class="title">本をさがす</div>
    </div>
    <div class="badge">📖</div>
  </div>

  <div class="save-error" id="saveError">保存に失敗しました。もう一度お試しください。</div>

  <div class="sidebar">
    <div id="announceArea"></div>
    <button class="announce-toggle" id="openAnnounceFormBtn">📣 お知らせを書く(管理者用)</button>
    <div class="announce-form" id="announceForm">
      <textarea id="announceText" placeholder="お知らせの内容を入力"></textarea>
      <div class="announce-form-row">
        <button id="postAnnounceBtn" class="submit-btn">投稿する</button>
        <button id="closeAnnounceFormBtn" class="cancel-btn">閉じる</button>
      </div>
    </div>

    <button class="add-toggle" id="showRankingBtn">🏆 いいねランキング</button>
  </div>

  <div class="main-content">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="タイトル・著者・ジャンルで検索" />
      <button id="clearSearchBtn" class="clear-btn" style="display:none;">✕</button>
    </div>

    <div class="ndc-grid" id="ndcGrid"></div>
    <button class="add-toggle" id="showFavsBtn">❤️ お気に入りを見る</button>

    <div class="list-heading" id="listHeading" style="display:none;"></div>
    <div id="listArea"></div>

    <button class="add-toggle bg-toggle" id="settingsBtn">🎨 背景をカスタマイズする</button>
    <div class="settings-panel" id="settingsPanel">
      <div class="settings-title">背景をカスタマイズ(この端末だけの設定です)</div>
      <div class="color-swatches" id="colorSwatches"></div>
      <label class="upload-label">
        画像を背景にする
        <input type="file" id="bgImageInput" accept="image/*" />
      </label>
      <div class="settings-row">
        <button id="resetBgBtn" class="cancel-btn">元に戻す</button>
        <button id="closeSettingsBtn" class="cancel-btn">閉じる</button>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
